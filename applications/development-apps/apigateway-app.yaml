apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkfolio-apigateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: 'https://github.com/HeoJunHyoung/linkfolio-manifest'
    targetRevision: feature/unified-infra-app-of-apps
    path: overlays/development/apigateway
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: linkfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true