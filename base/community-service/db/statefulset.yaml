apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-community
spec:
  serviceName: "mysql-community-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql-community
  template:
    metadata:
      labels:
        app: mysql-community
      annotations: # [Monitoring] Prometheus Exporter 설정
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
    spec:
      initContainers:
        - name: exporter-config-init
          image: busybox
          command: ["sh", "-c"]
          args:
            - |
              printf "[client]\nuser=root\npassword=%s\nhost=127.0.0.1\nport=3306\n" "$MYSQL_ROOT_PASSWORD" > /etc/mysqld-exporter/.my.cnf
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-instance-credentials
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: exporter-config
              mountPath: /etc/mysqld-exporter

      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: community-service-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: community-service-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: community-service-credentials
                  key: MYSQL_PASSWORD
          envFrom:
            - secretRef:
                name: mysql-instance-credentials
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d

        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.15.1
          ports:
            - containerPort: 9104
          args:
            - "--config.my-cnf=/etc/mysqld-exporter/.my.cnf"
          volumeMounts:
            - name: exporter-config
              mountPath: /etc/mysqld-exporter

      volumes:
        - name: init-db
          configMap:
            name: mysql-community-initdb-config
            defaultMode: 0755
        - name: exporter-config
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: manual
        resources:
          requests:
            storage: 5Gi