apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-pod-label
  template:
    metadata:
      labels:
        app: community-pod-label
      # --- Monitoring Annotations ---
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/community-service/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      containers:
        - name: community-container
          image: h6bro/service-community
          ports:
            - containerPort: 8085
          resources:
            requests:
              memory: "512Mi" # 최소 구동 보장
              cpu: "200m"      # 스케줄링 성공을 위해 낮게 유지
            limits:
              memory: "1Gi" # Spring Boot 구동 시 튀는 메모리 허용
              cpu: "1000m"     # 초기 구동 시 CPU를 좀 더 쓸 수 있게 여유 둠
          envFrom:
            - configMapRef:
                name: community-service-config
            - secretRef:
                name: community-service-credentials