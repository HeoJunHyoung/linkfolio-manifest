apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-pod-label
  template:
    metadata:
      labels:
        app: community-pod-label
    spec:
      containers:
        - name: community-container
          image: h6bro/service-community
          ports:
            - containerPort: 8085
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: community-service-config
            - secretRef:
                name: community-service-credentials