apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: default
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 9095

    clients:
      - url: http://loki.default.svc.cluster.local:3100/loki/api/v1/push

    positions:
      filename: /tmp/positions.yaml

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          # 1. 수집 조건을 완화하여 전 네임스페이스의 모든 파드 기본 수집
          - action: replace
            source_labels: [__meta_kubernetes_pod_namespace]
            target_label: namespace
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: node
          
          # 물리 노드의 실제 컨테이너 로그 경로(/var/log/pods/네임스페이스_파드명_UID/컨테이너/*.log)와 매칭 규칙 주입
          - source_labels: [__meta_kubernetes_pod_uid__, __meta_kubernetes_pod_container_name]
            action: replace
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1*/*.log