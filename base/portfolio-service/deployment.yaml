apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-pod-label
  template:
    metadata:
      labels:
        app: portfolio-pod-label
    spec:
      containers:
        - name: portfolio-container
          image: h6bro/service-portfolio # CI/CD가 관리할 이미지
          ports:
            - containerPort: 8082 # portfolio-service 포트
          envFrom:
            - configMapRef:
                name: portfolio-service-config
            - secretRef:
                name: portfolio-service-credentials