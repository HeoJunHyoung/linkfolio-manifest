apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-pod-label
  template:
    metadata:
      labels:
        app: portfolio-pod-label
      # --- Monitoring Annotations ---
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/portfolio-service/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: portfolio-container
          image: h6bro/service-portfolio # CI/CD가 관리할 이미지
          ports:
            - containerPort: 8082 # portfolio-service 포트
          resources:
            requests:
              memory: "512Mi" # 최소 구동 보장
              cpu: "200m"      # 스케줄링 성공을 위해 낮게 유지
            limits:
              memory: "1Gi" # Spring Boot 구동 시 튀는 메모리 허용
              cpu: "1000m"     # 초기 구동 시 CPU를 좀 더 쓸 수 있게 여유 둠
          envFrom:
            - configMapRef:
                name: portfolio-service-config
            - secretRef:
                name: portfolio-service-credentials