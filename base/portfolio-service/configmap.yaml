apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-service-config
  namespace: linkfolio
data:
  # DB
  DB_HOST: "mysql-portfolio-service:3306"
  MYSQL_DATABASE: "portfolio_db" # portfolio-service 전용 DB
  JPA_DDL_AUTO: "update"
  JPA_SHOW_SQL: "true"
  JPA_FORMAT_SQL: "true"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"

  # Redis
  REDIS_HOST: "redis-portfolio-service"
  REDIS_PORT: "6379"

  # Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "10.0.2.9:9092"
  SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: "10.0.2.9:9092"

  # Feign (from application.yml)
  APP_FEIGN_USER_SERVICE_URL: "http://user-service:80"