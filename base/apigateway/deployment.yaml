apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apigateway-pod-label
  template:
    metadata:
      labels:
        app: apigateway-pod-label
      # --- Monitoring Annotations ---
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: apigateway-container
          image: h6bro/service-apigateway
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi" # 최소 구동 보장
              cpu: "50m"      # 스케줄링 성공을 위해 낮게 유지
            limits:
              memory: "512Mi" # Spring Boot 구동 시 튀는 메모리 허용
              cpu: "500m"     # 초기 구동 시 CPU를 좀 더 쓸 수 있게 여유 둠
          envFrom:
            - configMapRef:
                name: apigateway-config
            - secretRef:
                name: apigateway-service-credentials