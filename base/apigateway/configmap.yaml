apiVersion: v1
kind: ConfigMap
metadata:
  name: apigateway-config
  namespace: linkfolio
data:
  # 1. User Service Route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: "user-service-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: "http://user-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: "Path=/user-service/**"

  # 2. Portfolio Service Route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: "portfolio-service-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: "http://portfolio-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: "Path=/portfolio-service/**"

  # 3. Auth Service Route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: "auth-service-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: "http://auth-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: "Path=/auth-service/**"

  # 4. Chat Service Route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: "chat-service-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: "http://chat-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: "Path=/chat-service/**"

  # 5. Chat Service (WebSocket)
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: "chat-service-ws-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: "ws://chat-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: "Path=/ws-chat/**"

  # 6. Support Service Route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_5_ID: "support-service-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_5_URI: "http://support-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_5_PREDICATES_0: "Path=/support-service/**"

  # 7. Community Service Route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_ID: "community-service-route"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_URI: "http://community-service:80"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_PREDICATES_0: "Path=/community-service/**"

  # Excluded URLs [community-service 경로 추가됨]
  APP_GATEWAY_EXCLUDEDURLS: "/user-service/welcome,/actuator,/v3/api-docs/**,/swagger-ui/**,/user-service/swagger-ui/**,/user-service/v3/api-docs/**,/auth-service/swagger-ui/**,/auth-service/v3/api-docs/**,/auth-service/auth/signup,/auth-service/auth/login,/auth-service/auth/refresh,/auth-service/auth/logout,/auth-service/auth/check-username,/auth-service/auth/check-password,/auth-service/auth/find-username,/auth-service/auth/password-reset/send-code,/auth-service/auth/password-reset/verify-code,/auth-service/auth/password-reset/change,/auth-service/auth/email-verification/send,/auth-service/auth/email-verification/check,/auth-service/oauth2/authorization/**,/auth-service/login/oauth2/code/**,/auth-service/error,/auth-service/auth/test/setup-user,/portfolio-service/portfolios,/portfolio-service/portfolios/{portfolioId:\\d+},/portfolio-service/swagger-ui/**,/portfolio-service/v3/api-docs/**,/support-service/notices,/support-service/notices/**,/support-service/faqs,/support-service/faqs/**,/support-service/v3/api-docs/**,/community-service/posts,/community-service/posts/**,/community-service/v3/api-docs/**,/portfolio-service/portfolio/test/setup,/community-service/community/test/setup,/support-service/support/test/setup"