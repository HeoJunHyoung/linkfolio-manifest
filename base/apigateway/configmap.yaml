# base/apigateway/configmap.yaml 수정
apiVersion: v1
kind: ConfigMap
metadata:
  name: apigateway-config
  namespace: linkfolio
data:
  # 1. Routes
  SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "user-service-route"
  SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://user-service:80"
  SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/user-service/**"

  # 2. Excluded URLs
  APP_GATEWAY_EXCLUDEDURLS: "/user-service/users/login,/user-service/users/signup,/user-service/welcome,/actuator,/user-service/swagger-ui,/user-service/v3/api-docs,/user-service/oauth2/authorization/**,/user-service/login/oauth2/code/**, /user-service/email-verification/send, /user-service/email-verification/check"