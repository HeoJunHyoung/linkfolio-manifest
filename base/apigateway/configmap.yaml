# base/apigateway/configmap.yaml (신규 생성)
apiVersion: v1
kind: ConfigMap
metadata:
  name: apigateway-config
  namespace: linkfolio # ✅ 배포 네임스페이스와 일치
data:
  # 1. Routes (Spring Boot 환경 변수 형식으로 변환)
  SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "user-service-route"
  SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://user-service:80" # ✅ K8s 내부 서비스 주소
  SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/user-service/**"
  SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: "RewritePath=/user-service/(?<segment>.*), /${segment}"
  # (다른 서비스 라우트 추가 시 여기에 계속 추가...)

  # 2. Excluded URLs (Spring Boot 환경 변수 형식: 대문자, _ 사용)
  # 키 이름을 application.yml과 일치시키려면 APP_GATEWAY_EXCLUDED-URLS 와 같이 사용
  # 또는 Spring Boot가 인식하는 APP_GATEWAY_EXCLUDEDURLS 형식 사용 (쉼표로 구분)
  APP_GATEWAY_EXCLUDEDURLS: "/user-service/users/login,/user-service/users/signup,/user-service/welcome,/actuator,/user-service/swagger-ui,/user-service/v3/api-docs"
