apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-auth
spec:
  serviceName: "mysql-auth-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql-auth
  template:
    metadata:
      labels:
        app: mysql-auth
      annotations: # [Monitoring] Prometheus Exporter 설정
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config # auth-service용 ConfigMap
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: auth-service-credentials # auth-service용 Secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-credentials # auth-service용 Secret
                  key: MYSQL_PASSWORD
          envFrom:
            - secretRef:
                name: mysql-instance-credentials
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
            - name: binlog-config
              mountPath: /etc/mysql/conf.d/debezium.cnf
              subPath: debezium.cnf

        # [Monitoring] MySQL Exporter Container 추가
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.15.1
          ports:
            - containerPort: 9104
          env:
            - name: DATA_SOURCE_NAME
              value: "root:$(MYSQL_ROOT_PASSWORD)@(localhost:3306)/"
          envFrom:
            - secretRef:
                name: mysql-instance-credentials # root 비밀번호 가져오기

      volumes:
        - name: init-db
          configMap:
            name: mysql-auth-initdb-config # auth-service용 init-db ConfigMap
            defaultMode: 0755
        - name: binlog-config
          configMap:
            name: mysql-auth-binlog-config
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: manual # auth-pv.yaml과 매칭
        resources:
          requests:
            storage: 5Gi