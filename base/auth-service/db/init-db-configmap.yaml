apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-auth-initdb-config
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    mysql -u root -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
      CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
      GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_USER}'@'%';
    
      CREATE USER IF NOT EXISTS 'debezium_user'@'%' IDENTIFIED BY 'dbzpassword';
      GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'debezium_user'@'%';
    
      USE \`${MYSQL_DATABASE}\`;

      -- AuthUser 테이블 생성 (Entity와 일치)
      CREATE TABLE IF NOT EXISTS auth_user (
          user_id BIGINT AUTO_INCREMENT PRIMARY KEY,
          username VARCHAR(255) UNIQUE,
          password VARCHAR(255),
          name VARCHAR(255),
          email VARCHAR(255) NOT NULL UNIQUE,
          role VARCHAR(50) NOT NULL,
          provider VARCHAR(50) NOT NULL,
          provider_id VARCHAR(255),
          status VARCHAR(50) NOT NULL,
          created_at DATETIME(6),
          last_modified_at DATETIME(6)
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

      -- [Admin 계정 추가]
      -- 비밀번호 'admin123!'의 BCrypt 해시값 사용
      INSERT INTO auth_user (user_id, username, password, name, email, role, provider, status, created_at, last_modified_at)
      SELECT * FROM (SELECT 1, 'admin', '$2a$10$8.UnVuG9HHgffUDAlk8qfOuVGkqRzgVwdFqaBEC7GTt.j5.OotuZm', '관리자', 'admin@linkfolio.com', 'ADMIN', 'LOCAL', 'COMPLETED', NOW(), NOW()) AS tmp
      WHERE NOT EXISTS (SELECT username FROM auth_user WHERE username = 'admin') LIMIT 1;

      FLUSH PRIVILEGES;
    EOSQL