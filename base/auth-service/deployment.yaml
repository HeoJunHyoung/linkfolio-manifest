apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-pod-label
  template:
    metadata:
      labels:
        app: auth-pod-label
      # --- Monitoring Annotations ---
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/auth-service/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: auth-container
          image: h6bro/service-auth # CI/CD가 업데이트할 이미지 이름
          ports:
            - containerPort: 8081 # auth-service 포트
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-credentials # auth-service용 시크릿