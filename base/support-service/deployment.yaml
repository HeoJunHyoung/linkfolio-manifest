apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support-pod-label
  template:
    metadata:
      labels:
        app: support-pod-label
    spec:
      containers:
        - name: support-container
          image: h6bro/service-support # CI/CD에서 관리
          ports:
            - containerPort: 8084 # application.yml의 port와 일치
          envFrom:
            - configMapRef:
                name: support-service-config
            - secretRef:
                name: support-service-credentials