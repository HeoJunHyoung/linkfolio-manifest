apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support-pod-label
  template:
    metadata:
      labels:
        app: support-pod-label
      # --- Monitoring Annotations ---
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/support-service/actuator/prometheus"
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: support-container
          image: h6bro/service-support # CI/CD에서 관리
          ports:
            - containerPort: 8084 # application.yml의 port와 일치
          resources:
            requests:
              memory: "256Mi" # 최소 구동 보장
              cpu: "100m"      # 스케줄링 성공을 위해 낮게 유지
            limits:
              memory: "512Mi" # Spring Boot 구동 시 튀는 메모리 허용
              cpu: "500m"     # 초기 구동 시 CPU를 좀 더 쓸 수 있게 여유 둠
          envFrom:
            - configMapRef:
                name: support-service-config
            - secretRef:
                name: support-service-credentials