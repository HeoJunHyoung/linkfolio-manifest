apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-chat-deployment
  namespace: linkfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-chat
  template:
    metadata:
      labels:
        app: redis-chat
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"