apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight-deployment
  namespace: linkfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
        - name: redis-insight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540 # Redis Insight 기본 포트
          securityContext:
            runAsUser: 1000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"