# heojunhyoung/k8s-msa-manifest/k8s-msa-manifest-dev/base/user-service/db/init-db-configmap.yaml (수정본)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-user-initdb-config
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    mysql -u root -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
      CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
      GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_USER}'@'%';
    
      CREATE USER IF NOT EXISTS 'debezium_user'@'%' IDENTIFIED BY 'dbzpassword';
      GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'debezium_user'@'%';
    
      FLUSH PRIVILEGES;
    EOSQL