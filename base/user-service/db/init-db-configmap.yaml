apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-user-initdb-config
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    mysql -u root -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
      CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
      GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_USER}'@'%';
    
      CREATE USER IF NOT EXISTS 'debezium_user'@'%' IDENTIFIED BY 'dbzpassword';
      GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'debezium_user'@'%';
    
      USE \`${MYSQL_DATABASE}\`;

      CREATE TABLE IF NOT EXISTS user_profile (
          user_id BIGINT PRIMARY KEY,
          username VARCHAR(255) UNIQUE,
          name VARCHAR(255),
          email VARCHAR(255) UNIQUE,
          birthdate VARCHAR(255),
          gender VARCHAR(50),
          role VARCHAR(50) NOT NULL,
          provider VARCHAR(50) NOT NULL,
          status VARCHAR(50) NOT NULL,
          created_at DATETIME(6),
          last_modified_at DATETIME(6)
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

      -- [Admin 프로필 추가: AS 구문으로 컬럼명 명시]
      INSERT INTO user_profile (user_id, username, name, email, role, provider, status, created_at, last_modified_at)
      SELECT * FROM (
        SELECT 
          1 AS user_id, 
          'admin' AS username, 
          '관리자' AS name, 
          'admin@linkfolio.com' AS email, 
          'ADMIN' AS role, 
          'LOCAL' AS provider, 
          'COMPLETED' AS status, 
          NOW() AS created_at, 
          NOW() AS last_modified_at
      ) AS tmp
      WHERE NOT EXISTS (SELECT user_id FROM user_profile WHERE user_id = 1) LIMIT 1;

      FLUSH PRIVILEGES;
    EOSQL