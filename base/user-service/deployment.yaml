apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-pod-label
  template:
    metadata:
      labels:
        app: user-pod-label
    spec:
      containers:
        - name: user-container
          image: h6bro/service-user
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-credentials