apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkfolio
spec:
  ingressClassName: nginx
  rules:
  - host: "linkfolio.127.0.0.1.nip.io"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apigateway-service
            port:
              number: 80