  newTag: a3624d8
- name: h6bro/service-portfolio
  newName: h6bro/service-portfolio
  newTag: a3624d8
- name: h6bro/service-support
  newName: h6bro/service-support
  newTag: a3624d8
- name: h6bro/service-user
  newName: h6bro/service-user
  newTag: a3624d8

# ngrok을 사용하지 않는 로컬 실행 환경이라면, 아래 내용 주석 !!!
patches:
- path: patch-auth-configmap-ngrok.yaml
