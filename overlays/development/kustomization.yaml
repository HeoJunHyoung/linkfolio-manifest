apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ingress.yaml
- ../../base
images:
- name: h6bro/service-apigateway
  newName: h6bro/service-apigateway
  newTag: 60d02c5
- name: h6bro/service-auth
  newName: h6bro/service-auth
  newTag: 60d02c5
- name: h6bro/service-user
  newName: h6bro/service-user
  newTag: 60d02c5


# ngrok을 사용하지 않는 로컬 실행 환경이라면, 아래 내용 주석 !!!
patches:
- path: patch-auth-configmap-ngrok.yaml
  target:
    kind: ConfigMap
    name: auth-service-config
